<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

  <h1>Tipos em JavaScript</h1>

  <button id="btn">Executar</button>

  <p id="pstring"></p>
  <p id="pnumero"></p>
  <p id="pboolean"></p>
  <p id="pundefined"></p>
  <p id="pnull"></p>
  <p id="pobjeto"></p>
  <p id="parray"></p>

  <h2>Operações</h2>
  <p id="op1"></p>
  <p id="op2"></p>
  <p id="op3"></p>
  <p id="op4"></p>

  <script>
    document.getElementById('btn').onclick = function () {

      // Variáveis
      const texto = "Olá";
      const numero = 5;
      const booleano = true;
      let indefinido;
      const nulo = null;
      const objeto = { a: 1 };
      const array = [1, 2, 3];

      // Exibir tipos
      document.getElementById('pstring').innerText = "String: " + typeof texto;
      document.getElementById('pnumero').innerText = "Number: " + typeof numero;
      document.getElementById('pboolean').innerText = "Boolean: " + typeof booleano;
      document.getElementById('pundefined').innerText = "Undefined: " + typeof indefinido;
      document.getElementById('pnull').innerText = "Null: " + typeof nulo;
      document.getElementById('pobjeto').innerText = "Object: " + typeof objeto;
      document.getElementById('parray').innerText = "Array: " + typeof array;

      // Operações
      const opStringNumber = texto + numero;
      const opBoolNumber = booleano * numero;
      const opNumberNull = numero + nulo;
      const opStringBool = texto + booleano;

      console.log("string + number =", opStringNumber);
      console.log("boolean * number =", opBoolNumber);
      console.log("number + null =", opNumberNull);
      console.log("string + boolean =", opStringBool);

      document.getElementById('op1').innerText = "texto + numero = " + opStringNumber;
      document.getElementById('op2').innerText = "booleano * numero = " + opBoolNumber;
      document.getElementById('op3').innerText = "numero + null = " + opNumberNull;
      document.getElementById('op4').innerText = "texto + booleano = " + opStringBool;
    };
  </script>

</body>
</html>
