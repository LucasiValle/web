<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Document</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    padding: 40px;
  }

  .container {
    max-width: 400px;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px #ccc;
    margin: auto;
  }

  input, button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    font-size: 16px;
  }

  button {
    cursor: pointer;
    background: #4CAF50;
    color: white;
    border: none;
    border-radius: 6px;
  }

  #resultadoPrimos {
    margin-top: 20px;
    background: #e6e6e6;
    padding: 15px;
    border-radius: 6px;
  }
</style>

</head>
<body>

<div class="container">
  <h2>Descobrir Números Primos</h2>

  <label>Início:</label>
  <input type="number" id="inicio">

  <label>Fim:</label>
  <input type="number" id="fim">

  <button onclick="verificarPrimos()">Verificar</button>

  <div id="resultadoPrimos"></div>
</div>

<script>

function ehPrimo(num) {
    if (num < 2) return false;
    for (let i = 2; i <= Math.sqrt(num); i++) {
      if (num % i === 0) return false;
    }
    return true;
  }


  function verificarPrimos() {
    const inicio = Number(document.getElementById("inicio").value);
    const fim = Number(document.getElementById("fim").value);
    const resultado = document.getElementById("resultadoPrimos");

    if (inicio > fim) {
      resultado.innerHTML = "⚠ O número inicial deve ser menor que o final.";
      return;
    }

    let primos = [];

    for (let n = inicio; n <= fim; n++) {
      if (ehPrimo(n)) primos.push(n);
    }

    resultado.innerHTML = 
      primos.length === 0 
        ? "Nenhum número primo encontrado." 
        : "Primos encontrados: <br><b>" + primos.join(", ") + "</b>";
  }
</script>

</body>
</html>
