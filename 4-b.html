<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4-b</title>
    <style>
        .container{
            position: relative;
        }

        .box{
            display: inline-block; 
            width: 500px;
            height: 500px;
            position: static;
        }
        #box{
            position: fixed;
            background-color: cadetblue;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="box" class="box"> </div>
    </div>
</body>
</html>
