<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        *{border: 1px solid black;}
        
        img{
            float: left;
            width: 100px;
        }
        .box{
            display: inline-block; /*permite os elementos da box ficarem ao lado*/
            /*inline-block da para definir a altura e largura*/
            width: 100px;
            height: 100px;
            position: static;
        }

        #box2{
            position: relative;
            top: 100px;
        }

        #box3{
            background-color: bisque;
            position: absolute; /*posicionam ao começo*/
            top: 1px;
            left: 10px;
        }

        #box4{
            position: fixed;
            background-color: aqua;
           /* bottom: 50%;/*bota o box aonde quer*/
            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            z-index: 1; /*controla as camadas, bota para baixo o -1, bota pra cima 1*/

        }

        .container{
            position: relative;
        }

        html, body{border-color: red;}
        

   </style>
    
    <title>Document</title>
</head>
<body>
        
    <h1>Titulo bla bla</h1>
    <p>Lorem ipsum dolor sit lo amet consectetur adipisicing elit. Cupiditate vitae debitis sed voluptas.
         Minima temporibus in voluptates, explicabo impedit sint sequi.Unde et cupiditate nam quas 
         ratione sunt consequatur necessitatibus?<img src="./img/Roblox.png" alt=""></p>

    <div class = "conteiner"> 

    <div id="box1" class = "box">box1</div>
    <div id="box2" class = "box">box2</div>
    <div id="box3" class = "box">box3</div>
    <div id="box4" class = "box">box4</div>
    <div id="box5" class = "box">box5</div>

    </div>
</body>
</html>
