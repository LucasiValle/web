<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bandeiras</title>

    <style>


    .body{
        overflow-y: hidden;
        overflow-x: hidden;
    }
    
    .pagina{
        height: 100vh;
        display: flex;
        justify-content: space-between;
        align-items: center;
        
    }   

    .Franca{
        border: 1px solid black;
        display: flex;
        height: 200px;
        width: 200px;
        flex-direction: row;
        
    }

    .franca{
        height: 200px;
        width: 200px;
        display: flex;
    }

    .Alemanha{
        border: 1px solid black;
        display: flex;
        height: 200px;
        width: 200px;
        flex-direction: column;
    }

    .alemanha{
        height: 200px;
        width: 200px;
        display: flex;
    }


    .Japão{
        border: 1px solid black;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 200px;
        width: 200px;
    }

    .japao{
        width: 100px;
        height: 100px;
        border-radius: 50%
    }


    #azul{
        background-color: blue;
    }
    
    #branco{
        background-color: white;
    }
    #vermelho{
        background-color: red;
    }
    
    #preto{
        background-color: black;
    }

    #amarelo{
        background-color: yellow;
    }    
    </style>
</head>
<body>
 <div class="pagina">  
    <div class="Franca">
        <div id="azul" class="franca"></div>
        <div id="branco" class="franca"></div>
        <div id="vermelho" class="franca"></div>
    </div>

    <div class="Alemanha ">
        <div id="preto" class="alemanha"></div>
        <div id="vermelho" class="alemanha"></div>
        <div id="amarelo" class="alemanha"></div>
    </div>

    <div class="Japão  ">
        <div id="vermelho" class="japao"></div>
    </div>
</div> 
</body>
</html>
