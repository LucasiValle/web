<!--Uma regra CSS é o bloco básico de código usado para definir o estilo de um ou mais elementos em uma página HTML.
Ela determina como os elementos selecionados devem ser exibidos (por exemplo, sua cor, tamanho, fonte, margens, etc.).-->


<!--Uma regra CSS é composta por Seletor: identifica qual elemento ou grupo de elementos será estilizado e 
Declaração: define o estilo aplicado, composta por uma propriedade e um valor.-->

p {
  color: blue;
}

<!--O p é o seletor, o color a propriedade e o blue o valor -->
